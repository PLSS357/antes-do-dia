<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><meta name="theme-color" content="#080e0b"><title>Antes do Amanhã — Arquivo Fantasma</title><style>
:root{color-scheme:dark;--bg:#080e0b;--ink:#abc5b1;--dim:#647d6c;--bright:#c4e8c9;--line:#2b4031;--error:#ed8c81;--gold:#d1bd82}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.65 Consolas,'Lucida Console',monospace}body:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:5;opacity:.12;background:repeating-linear-gradient(0deg,#000 0,#000 1px,transparent 1px,transparent 4px)}body:after{content:'';position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 160px #0005}main{height:100dvh;display:flex;flex-direction:column;padding:22px 32px 14px;max-width:1600px;margin:auto}header{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:13px;color:var(--dim);font-size:11px;letter-spacing:1.5px}header strong{font-weight:normal;color:var(--bright)}#screen{flex:1;overflow:auto;padding:26px 0 20px;scrollbar-color:var(--line) var(--bg);overflow-wrap:anywhere}.line{white-space:pre-wrap;margin:0 0 9px;max-width:104ch}.dim{color:var(--dim)}.bright{color:var(--bright)}.error{color:var(--error)}.gold{color:var(--gold)}.echo{color:#92b7a3;margin-top:18px}.mast{font-size:clamp(20px,4vw,44px);line-height:1.2;letter-spacing:3px;color:var(--bright);margin:18px 0}.sub{letter-spacing:3px;font-size:11px;color:var(--dim)}form{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:14px}label{color:var(--bright);max-width:60%;overflow-wrap:anywhere}input{min-width:60px;flex:1;color:var(--bright);background:transparent;border:0;outline:0;font:inherit;caret-color:var(--bright);padding:3px}input:focus-visible{box-shadow:0 1px var(--dim)}footer{font-size:10px;color:var(--dim);display:flex;justify-content:space-between;padding-top:13px;letter-spacing:1px}.blink{animation:blink 1.2s steps(1) infinite}@keyframes blink{50%{opacity:0}}::selection{background:#42664b;color:#fff}@media(prefers-reduced-motion:reduce){.blink{animation:none}}@media(max-width:600px){main{padding:14px 13px 10px}html,body{font-size:12px}header{font-size:9px;letter-spacing:.5px}header span:last-child{max-width:45%;text-align:right}form{gap:6px}footer{font-size:8px;letter-spacing:0}.line{line-height:1.75}label{max-width:50%}}
</style></head><body><main><header><span><strong>ARQUIVO FANTASMA</strong> / NÓ 07</span><span>MEMÓRIA RESIDUAL · INTEGRIDADE 83.7%</span></header><section id="screen" role="log" aria-label="Saída do terminal" aria-live="polite" tabindex="0"></section><form id="cli" autocomplete="off"><label for="command" id="prompt">arquivo@amanha:~$</label><input id="command" aria-label="Comando do terminal" spellcheck="false" autocapitalize="off" autocomplete="off" autofocus maxlength="2048"></form><footer><span>CANAL LOCAL / SEM TELEMETRIA</span><span id="foot">HELP: COMANDOS · TAB: COMPLETAR <span class="blink">▌</span></span></footer></main><script>/* BUNDLE */</script></body></html>
